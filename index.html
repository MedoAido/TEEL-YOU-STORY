<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MEDOinfo — Prototype cliquable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">

    <!-- ===== FLUX ===== -->
    <section class="view" id="view-flux" data-view="flux">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">MEDO<em>info</em></span>
          <span class="brand-tagline">ACTU · SPORT · PASSION — L'INFO QUI GARDE SON POULS</span>
        </div>
      </header>

      <div class="chipbar" id="chipbar" role="group" aria-label="Filtrer par pilier">
        <button class="chip chip--actu is-active" data-pillar="actu" aria-pressed="true">Actu</button>
        <button class="chip chip--sport is-active" data-pillar="sport" aria-pressed="true">Sport</button>
        <button class="chip chip--passion is-active" data-pillar="passion" aria-pressed="true">Passion</button>
      </div>

      <div class="card-list" id="card-list"></div>
    </section>

    <!-- ===== ARTICLE ===== -->
    <section class="view" id="view-article" data-view="article">
      <header class="topbar topbar--article">
        <button class="btn-back" data-back-to="flux" aria-label="Retour au flux">←</button>
        <span class="topbar-title">Article</span>
        <span class="topbar-spacer"></span>
      </header>
      <div class="article-body" id="article-body"></div>
    </section>

    <!-- ===== DIRECT ===== -->
    <section class="view" id="view-direct" data-view="direct">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">MEDO<em>info</em></span>
          <span class="brand-tagline">DIRECT</span>
        </div>
      </header>

      <div class="scoreboard" id="scoreboard"></div>

      <div class="direct-toolbar">
        <span class="direct-toolbar-label">Fil du match</span>
        <button class="btn-refresh" id="btn-refresh">Actualiser</button>
      </div>

      <div class="event-feed" id="event-feed"></div>
    </section>

    <!-- ===== PROFIL ===== -->
    <section class="view" id="view-profil" data-view="profil">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">MEDO<em>info</em></span>
          <span class="brand-tagline">PROFIL</span>
        </div>
      </header>

      <div class="profil-body">
        <div class="profil-card">
          <div class="profil-avatar" aria-hidden="true">MI</div>
          <div class="profil-name">Mon profil de lecture</div>
          <div class="profil-sub">Ajustez le poids éditorial de chaque pilier. Le flux se réordonne en direct.</div>
        </div>

        <div class="slider-group" id="slider-group"></div>

        <button class="btn-reset" id="btn-reset-weights">Réinitialiser l'équilibre</button>
      </div>
    </section>

    <!-- ===== NAV ===== -->
    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-tab="flux">
        <span class="tab-icon" data-icon="flux"></span>
        <span class="tab-label">Flux</span>
      </button>
      <button class="tab" data-tab="direct">
        <span class="tab-icon" data-icon="direct"></span>
        <span class="tab-label">Direct</span>
      </button>
      <button class="tab" data-tab="profil">
        <span class="tab-icon" data-icon="profil"></span>
        <span class="tab-label">Profil</span>
      </button>
    </nav>

  </div>

  <p class="stage-footnote">MEDO · APPLICATION MEDO INFO — TYS · PROTOTYPE INTERNE</p>
</div>

<script src="js/app.js"></script>
</body>
</html>
